name: StrategyOS Live Research UI

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment containing the hosted URL and preview identity
        required: true
        type: choice
        default: hetzner-qa
        options:
          - hetzner-qa
          - production

permissions:
  contents: read

concurrency:
  group: strategyos-live-research-ui-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  browser-acceptance:
    name: Governed research Chromium walkthrough
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target_environment }}
    env:
      STRATEGYOS_PUBLIC_URL: ${{ vars.STRATEGYOS_PUBLIC_URL }}
      STRATEGYOS_IDP_TEST_USERS: ${{ secrets.STRATEGYOS_IDP_TEST_USERS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install Chromium runner
        run: |
          python -m pip install playwright==1.55.0
          for f in $(sudo grep -rlE 'packages.microsoft.com|dl.google.com/linux/chrome' /etc/apt/ 2>/dev/null || true); do
            sudo rm -f "$f"
          done
          sudo find /etc/apt/ -type f \( -name '*microsoft*' -o -name '*azure*' -o -name '*google-chrome*' \) -delete 2>/dev/null || true
          python -m playwright install --with-deps chromium

      - name: Exercise governed research through the hosted UI
        run: python scripts/hosted_research_ui_acceptance.py --output-dir hosted-research-ui-acceptance

      - name: Upload screenshot and report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-research-ui-acceptance-${{ github.run_id }}
          path: hosted-research-ui-acceptance/
          if-no-files-found: error
          retention-days: 30
