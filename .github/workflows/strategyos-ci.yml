name: StrategyOS CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "deploy/README.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "deploy/README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategyos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Full suite. Do NOT hand-pick a subset here again: a hand-picked list
  # silently stops gating every file added after it was written, which is
  # exactly how test_qa.py / test_llm_qa.py / test_case_file_writer.py /
  # the Oracle phase tests / all twins tests went unguarded and main
  # shipped red for multiple review cycles while this workflow reported
  # green. Tests requiring live external services self-skip via
  # pytest.ini_options markers ("integration") or an env-var skipif guard
  # (see test_governed_review_flow_postgres_e2e.py,
  # test_graph_queries_neo4j_e2e.py, test_graph_retrieval_neo4j_e2e.py) --
  # they do not need to be excluded here.
  CI_TEST_TARGETS: "tests/"
  # The shared runner isolates runtime state and selects repository-owned fixtures.

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      qdrant:
        image: qdrant/qdrant:v1.14.1
        ports:
          - 6333:6333
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: isolated-proof-only
          POSTGRES_DB: strategyos_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proof -d strategyos_proof"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/isolated-proof-only
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p isolated-proof-only 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      STRATEGYOS_POSTGRES_E2E_DATABASE_URL: postgresql://proof:isolated-proof-only@localhost:5432/strategyos_proof
      STRATEGYOS_NEO4J_E2E_URI: bolt://localhost:7687
      STRATEGYOS_NEO4J_E2E_USER: neo4j
      STRATEGYOS_NEO4J_E2E_PASSWORD: isolated-proof-only
      STRATEGYOS_QDRANT_E2E_URL: http://localhost:6333
      STRATEGYOS_EMBEDDING_E2E_MODEL_PATH: /tmp/strategyos-proof-model
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OCR runtime
        run: |
          # Aggressively disable ALL Microsoft/Azure apt sources — ubuntu-24.04 runner
          # images configure azure-cli via arbitrary file paths and formats.
          # Find any file under /etc/apt/ mentioning packages.microsoft.com and remove.
          for f in $(sudo grep -rl 'packages.microsoft.com' /etc/apt/ 2>/dev/null || true); do
            sudo rm -f "$f"
          done
          # Also nuke any remaining microsoft*/azure* source files by name glob
          sudo find /etc/apt/ -type f \( -name '*microsoft*' -o -name '*azure*' \) -delete 2>/dev/null || true
          # Allow insecure repos in case a stale apt cache entry still references the URL
          sudo apt-get update -o Acquire::AllowInsecureRepositories=true
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[search]' pytest

      - name: Provision pinned local proof model
        run: python scripts/provision_embeddings.py --destination /tmp/strategyos-proof-model

      - name: Run tests
        run: python scripts/test.py --services -q ${CI_TEST_TARGETS} --junitxml=service-results.xml

      - name: Reject skipped or empty service proofs
        run: python scripts/check_test_report.py service-results.xml

  compose-contract:
    name: Compose contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Generate disposable compose env
        run: SECRETS_FILE=deploy/.env.secrets.ci deploy/scripts/generate_env.sh deploy/.env.ci

      - name: Validate source-build compose
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci --env-file deploy/.env.secrets.ci config -q

      - name: Validate release-image compose
        env:
          STRATEGYOS_API_IMAGE: ghcr.io/example/strategyos-mvp:test
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.release.yml -f deploy/docker-compose.hetzner-qa.yml --env-file deploy/.env.ci --env-file deploy/.env.secrets.ci config -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    needs:
      - tests
      - compose-contract
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha,scope=strategyos-runtime
          cache-to: type=gha,mode=max,scope=strategyos-runtime,ignore-error=true
          build-args: |
            POPPLER_UTILS_VERSION=25.03.0-5+deb13u4
            STRATEGYOS_RELEASE_SHA=${{ github.sha }}
