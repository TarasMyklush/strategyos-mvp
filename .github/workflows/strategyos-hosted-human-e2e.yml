name: StrategyOS Hosted Human E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategyos-hosted-human-e2e
  cancel-in-progress: false

jobs:
  source-finance:
    name: Customer source finance acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hetzner-branch
    env:
      STRATEGYOS_PUBLIC_URL: ${{ vars.STRATEGYOS_PUBLIC_URL }}
      STRATEGYOS_IDP_TEST_USERS: ${{ secrets.STRATEGYOS_IDP_TEST_USERS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Process, review and approve the customer finance source
        run: python scripts/hosted_source_finance_acceptance.py --output-dir hosted-source-finance-acceptance

      - name: Upload source finance acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-source-finance-acceptance-${{ github.run_id }}
          path: hosted-source-finance-acceptance/
          if-no-files-found: error
          retention-days: 30

  customer-intent:
    name: Customer Intent acceptance
    needs: source-finance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hetzner-branch
    env:
      STRATEGYOS_PUBLIC_URL: ${{ vars.STRATEGYOS_PUBLIC_URL }}
      STRATEGYOS_IDP_TEST_USERS: ${{ secrets.STRATEGYOS_IDP_TEST_USERS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Ratify and reconcile the staged customer plan
        run: python scripts/hosted_customer_intent_acceptance.py --output-dir hosted-customer-intent-acceptance

      - name: Upload acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-customer-intent-acceptance-${{ github.run_id }}
          path: hosted-customer-intent-acceptance/
          if-no-files-found: error
          retention-days: 30

  walkthrough:
    name: Executive Chromium walkthrough
    needs: customer-intent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hetzner-branch
    env:
      STRATEGYOS_PUBLIC_URL: ${{ vars.STRATEGYOS_PUBLIC_URL }}
      STRATEGYOS_IDP_TEST_USERS: ${{ secrets.STRATEGYOS_IDP_TEST_USERS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install browser runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Walk the deployed executive story
        run: python scripts/hosted_human_e2e.py --output-dir hosted-human-e2e

      - name: Upload screenshots, downloads and report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-human-e2e-${{ github.run_id }}
          path: hosted-human-e2e/
          if-no-files-found: error
          retention-days: 30

  intent-mutations:
    name: Intent lifecycle Chromium walkthrough
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: hetzner-branch
    env:
      STRATEGYOS_PUBLIC_URL: ${{ vars.STRATEGYOS_PUBLIC_URL }}
      STRATEGYOS_IDP_TEST_USERS: ${{ secrets.STRATEGYOS_IDP_TEST_USERS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install browser runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Exercise hosted Intent mutations
        run: python scripts/hosted_intent_mutation_e2e.py --output-dir hosted-intent-mutation-e2e

      - name: Upload screenshots and report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-intent-mutation-e2e-${{ github.run_id }}
          path: hosted-intent-mutation-e2e/
          if-no-files-found: error
          retention-days: 30
