# Branch preview stack override.
# Pairs with --project-name strategyos-branch so Docker Compose automatically
# prefixes all volume/network names, avoiding collisions with the production stack.
# Used together with hetzner-qa.yml for host-port isolation on the shared Hetzner host.
services:
  strategyos-api:
    environment:
      DATABASE_URL: ${STRATEGYOS_RUNTIME_DATABASE_URL:-postgresql://unconfigured@postgres/strategyos}
      STRATEGYOS_DATABASE_SCHEMA_MODE: verify

  strategyos-worker:
    environment:
      DATABASE_URL: ${STRATEGYOS_RUNTIME_DATABASE_URL:-postgresql://unconfigured@postgres/strategyos}
      STRATEGYOS_DATABASE_SCHEMA_MODE: verify

  strategyos-claim-projector:
    environment:
      DATABASE_URL: ${STRATEGYOS_RUNTIME_DATABASE_URL:-postgresql://unconfigured@postgres/strategyos}
      STRATEGYOS_DATABASE_SCHEMA_MODE: verify

  strategyos-migrate:
    profiles: [schema-migration]
    image: ${STRATEGYOS_API_IMAGE:-strategyos-preview-migration:unconfigured}
    # Deployment-only container; no Docker socket or application data mounts.
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-strategyos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-strategyos}
      STRATEGYOS_DATABASE_SCHEMA_MODE: auto
      STRATEGYOS_DEPLOYMENT_BOUNDARY: preview
    volumes:
      - /opt/strategyos-branch/runtime-database:/runtime-database
    command: [python, -m, strategyos_mvp.database_schema, --apply, --preview-runtime-env, /runtime-database/runtime.env]

  caddy:
    ports: !override
      - "${STRATEGYOS_HTTP_PORT:-8080}:80"
      - "${STRATEGYOS_HTTPS_PORT:-8443}:443"
    environment:
      STRATEGYOS_SITE_ADDRESS: ${STRATEGYOS_SITE_ADDRESS:-:80}
    volumes: !override
      - ./caddy/Caddyfile.branch:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"

  strategyos-idp:
    ports: !override
      - "127.0.0.1:${STRATEGYOS_IDP_HTTP_PORT:-8090}:9000"

  hatchet-lite:
    ports: !override
      - "127.0.0.1:${HATCHET_DASHBOARD_PORT:-18888}:8888"
      - "127.0.0.1:${HATCHET_GRPC_PORT:-17077}:7077"
